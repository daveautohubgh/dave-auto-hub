<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dave Auto Hub Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/"><b>DA</b> Dave Auto Hub</a><a href="/">View site</a></div></header><main class="wrap admin"><section id="login" class="box narrow"><span class="eyebrow">PRIVATE ADMIN</span><h1>Sign in</h1><form id="loginForm"><input id="user" required placeholder="Username"><input id="pass" required type="password" placeholder="Password"><button class="btn primary">Sign in</button></form></section><section id="dash" class="hidden"><div class="head"><div><span class="eyebrow">DASHBOARD</span><h1>Manage Dave Auto Hub</h1></div><button class="btn secondary" onclick="logout()">Log out</button></div><div class="adminGrid"><form id="carForm" class="box"><h2>Add / Edit Vehicle</h2><input type="hidden" id="id"><input id="name" required placeholder="Make & model"><div class="two"><input id="year" required type="number" placeholder="Year"><select id="type"><option>Korean</option><option>Used</option><option>Brand New</option><option>Imported</option></select></div><div class="two"><input id="price" required type="number" placeholder="Price GHS"><input id="engine" placeholder="Engine size"></div><div class="two"><input id="mileage" placeholder="Mileage"><input id="trans" placeholder="Transmission"></div><div class="two"><input id="fuel" placeholder="Fuel"><select id="status"><option>Available</option><option>Reserved</option><option>Sold</option></select></div><input id="photo" placeholder="Photo URL"><textarea id="desc" placeholder="Description"></textarea><button class="btn primary">Save vehicle</button><button type="button" class="btn secondary" onclick="clearForm()">Clear</button></form><div class="box"><h2>Inventory</h2><div id="list"></div></div></div><div class="box"><h2>Reservations</h2><div id="reservations"></div></div></section></main><script src="/admin.js"></script></body></html>
